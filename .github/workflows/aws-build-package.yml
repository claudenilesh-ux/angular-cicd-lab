name: Build Angular for AWS S3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check TypeScript
        run: npm run check

      - name: Build Angular for AWS
        run: npm run build -- --base-href /

      - name: Upload AWS deployment package
        uses: actions/upload-artifact@v4
        with:
          name: angular-aws-build
          path: dist/angular-cicd-lab/browser/
          if-no-files-found: error
          retention-days: 3
